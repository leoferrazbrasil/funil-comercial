# Supabase project configuration.
#
# The two WhatsApp webhook endpoints are called by Z-API's servers, which send
# their own "Client-Token" header and CANNOT present a Supabase JWT. With the
# platform default (verify_jwt = true) the Edge runtime rejects those POSTs with
# 401 *before* our handler runs — so the Z-API "on connect" / "on message"
# webhooks silently never reach us. Disabling JWT verification for exactly these
# two functions makes them publicly reachable; each still authenticates the
# caller internally (FUNIL_WEBHOOK_SECRET / Z-API instanceId checks).
#
# Functions omitted here keep the secure default (verify_jwt = true).
# whatsapp-manager and whatsapp-send are always invoked from the browser WITH
# the signed-in user's JWT and must stay protected.

project_id = "juvwfxnlusrnvcarkrmc"

# Z-API connection-status webhook (ConnectedCallback / on-disconnect) + Evolution.
[functions.whatsapp-qr-inbound]
verify_jwt = false

# Inbound message webhook (Z-API on-message-received / Meta Cloud API).
[functions.whatsapp-inbound]
verify_jwt = false

# Runner de campanhas: chamado pelo Supabase Cron (x-campaign-secret) e pelo
# front (JWT do usuário). Autentica internamente.
[functions.campaign-runner]
verify_jwt = false

# Public website lead form intake. The function validates payload/honeypot and
# uses service-role internally to write the default owner's lead.
[functions.lead-intake]
verify_jwt = false

# Admin cria vendedor: chamado pelo navegador com JWT do admin.
[functions.team-create-member]
verify_jwt = true
