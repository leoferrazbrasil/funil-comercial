    <!-- Aplica o tema (light/dark) ANTES do primeiro paint, síncrono e antes do
         CSS/React carregarem — evita o flash do tema claro no reload. Mesma
         lógica do useEffect em App.tsx; mudou lá, mudar aqui também. -->
    <script>
      (function () {
        try {
          var theme =
            localStorage.getItem("theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
