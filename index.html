         CSS/React carregarem — evita o flash do tema claro no reload. Mesma
         lógica do useEffect em App.tsx; mudou lá, mudar aqui também. -->
    <script>
      (function () {
        try {
          var theme =
            localStorage.getItem("theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();

      (function() {
        if ('modelContext' in navigator) {
          const controller = new AbortController();
          const toolDef = {
            name: "schedule_meeting",
            description: "Schedule a commercial funnel structure meeting with the Funil Comercial team",
            inputSchema: {
              type: "object",
              properties: {},
              required: []

            execute: async (args) => {
              window.location.href = "https://wa.me/5551992568861?text=Ol%C3%A1,%20gostaria%20de%20agendar%20uma%20reuni%C3%A3o.";
              return { content: [{ type: "text", text: "Redirected user to WhatsApp for scheduling." }] };
            }
          };

          if (typeof navigator.modelContext.provideContext === 'function') {
            navigator.modelContext.provideContext({ tools: [toolDef] });
          } else if (typeof navigator.modelContext.registerTool === 'function') {
            navigator.modelContext.registerTool(
              toolDef.name,
              toolDef.description,
              toolDef.inputSchema,
              toolDef.execute,
              { signal: controller.signal }
            );
          }
        }
      })();
